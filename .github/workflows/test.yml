name: test

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Guardas del sistema de diseño. Va ANTES del build a propósito: es la
      # comprobación más rápida y la que más veces va a fallar mientras el
      # equipo se acostumbra a los tokens, así que conviene el feedback pronto.
      #
      # No es `npm run lint` completo porque el repo arrastra 7 errores ajenos
      # a las guardas; bloquear con ellos obligaría a limpiar deuda no
      # relacionada antes de poder proteger lo que ya está a cero. Ver
      # scripts/lint-guardrails.mjs.
      - name: Design-system guardrails
        run: npm run lint:guardrails

      # Componentes JSX usados sin importar. Aislado del lint completo por el
      # mismo motivo que las guardas: el repo arrastra errores ajenos. Esta
      # regla concreta está a cero y su incumplimiento es una página en blanco
      # en producción con el build en verde — la pestaña Trust anchors estuvo
      # así desde su commit. Ver scripts/lint-undef.mjs.
      - name: No undefined JSX components
        run: npm run lint:undef

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
